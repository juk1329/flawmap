# Public phone videos offered on the request page ("공개 영상으로 해 보기"). They come from uCO3D
# (crowd-sourced 360-degree object videos, CC BY 4.0): ordinary phones filmed on ordinary surfaces,
# no board, no LiDAR, no drawing of the model. Cameras are the dataset's own SfM reconstruction; the
# size is assumed (width 71.5 mm). Only sequences present under uco3d_root are shown.
# Chosen on 2026-11-16 from 86 "cracked screen" candidates (>= 1080p, >= 150 registered cameras) by
# looking at the frames, then processed with `flawmap uco3d` (numbers in docs/project_guide.md, section 4).
uco3d_root: data/datasets/uco3d
uco3d:
  - name: 2712-37354-8763
    face_up: screen
    title: "청록 테두리 휴대폰, 액정 금 (나무 판자 위)"
    note: "금이 3D 텍스처에도 보입니다. 1440×1440, 화면 100% 촬영"
    license: "uCO3D, CC BY 4.0"
  - name: 59015-27660-21826
    face_up: screen
    title: "흰색 아이폰, 액정 금 (검은 바닥 위)"
    note: "수화부·홈 버튼·테두리 선은 좌우 대칭이라 하자에서 빠집니다. 1080×1920"
    license: "uCO3D, CC BY 4.0"
  - name: 24925-17239-690
    face_up: screen
    title: "흰색 휴대폰, 액정 금 (초록 천 위)"
    note: "1920×1080, 화면 100% 촬영"
    license: "uCO3D, CC BY 4.0"
  - name: 29776-61880-12178
    face_up: screen
    title: "흰색·청록 휴대폰, 액정 금 (나무 판자 위)"
    note: "점군이 흐트러져 첫 위치를 두 방법으로 잡는 예입니다. 1440×1440"
    license: "uCO3D, CC BY 4.0"
  - name: 9557-8788-41196
