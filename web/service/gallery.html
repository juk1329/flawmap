<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공개된 결과 | flawmap</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/service/service.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <section>
    <h1>공개된 검수 결과</h1>
    <p class="lead">요청자가 공개 목록에 올린 결과입니다. 검수 표를 누르면 3D 결과와 하자마다의 근거 장면을 봅니다. 링크로만 공유한 결과는 여기에 나오지 않습니다.</p>
  </section>
  <section>
    <ul class="listings" id="list"></ul>
  </section>
</main>
<script type="module">
import { $, esc, getJSON, topbar, tagHTML, when } from '/service/service.js';
$('top').innerHTML = topbar('/gallery');
const list = await getJSON('/api/gallery');
const SRC = { demo: '예시', public: '공개 영상', sample: '가상 촬영' };
if (!list.length) {
  $('list').outerHTML = `<div class="empty-state"><p><b>아직 공개된 결과가 없습니다.</b></p><p class="muted">검수를 요청하고 결과 화면에서 "공개 목록에도 올리기"를 켜면 여기에 나타납니다.</p><a class="btn" href="/new">검수 요청하기</a></div>`;
} else {
  $('list').innerHTML = list.map((x) =>
    `<li class="listing">` +
    (x.thumbnail ? `<img class="thumb" src="${esc(x.thumbnail)}" alt="${esc(x.title)} 촬영 장면" loading="lazy">` : `<span class="thumb" aria-hidden="true"></span>`) +
    `<div><h3>${esc(x.title || x.device_name || '검수한 물건')}</h3>` +
    `<p class="small muted">${esc(x.device_name || '')}${x.requester ? `, 요청자 ${esc(x.requester)}` : ''}${SRC[x.source] ? `, ${SRC[x.source]}` : ''}</p>` +
    `<p class="small muted">${when(x.finished)} 검수</p></div>` +
    tagHTML(x, { href: x.report_url }) + `</li>`).join('');
}
</script>
</body>
</html>
